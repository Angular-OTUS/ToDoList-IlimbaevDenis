<div class="up-container">
<div class="radio-group">
  <mat-radio-group
    aria-label="Filter tasks"
    [(ngModel)]="filterOption"
    (change)="clickOnRadioButton()"
  >
    <mat-radio-button value="Progress">{{ "PROGRESS" | translate }}</mat-radio-button>
    <mat-radio-button value="Completed">{{"COMPLETED" | translate}}</mat-radio-button>
  </mat-radio-group>
</div>
</div>
<div class="down-container">
<ul class="to-list">

    @for (task of tasks(); track task) {
    @if(task.status === filter()){
  <app-to-do-list-item-component
    [isStart]="isStart"
    [sharedId]="task.id"
    [statusIsCompleted]="task.status === 'Completed'"
    [taskId]="task.id"
    [textDiscriprion]="task.description"
    [textTask]="task.title"
    [visibleChanger]="false"
    (click)="changeToDoListItemOnPreview(task.id)"
  />
    }
  <!-- click тригерит перендеринг компонента  -->
  } @empty {
  <li class="to-list-item-notfound " style="color: black">{{"ELEMENTS404" | translate}}</li>
  } 
</ul>
<div class="container-for-adding-task">
  <div class="container-for-adding-task__inputs">
    <mat-form-field class="container-for-adding-task__inputs__input">
      <mat-label> {{"ADD-TASK" | translate}}</mat-label>
      <input appEnterControl matInput [formControl]="addControlForm" [(ngModel)]="article"/>
    </mat-form-field>
    <mat-form-field class="container-for-adding-task__inputs__textarea">
      <mat-label>{{"ADD-DESCRIPTION" | translate}}</mat-label>
      <input appEnterControl matInput [formControl]="addControlForm"  [(ngModel)]="description"/>
    </mat-form-field>
  </div>
  <app-to-do-button-component
    myTitle="{{'ADD-TASK' | translate}}"
    [(styles)]="stylesForButton"
    (myClickChange)="addTask()"
  />
</div>
</div>
